[package]
name = "maw"
version = "0.31.3"
edition = "2024"
description = "A simple and efficient web framework for Rust."
repository = "https://github.com/Srlion/maw"
license = "MIT"

[[example]]
name = "hello_world"

[[example]]
name = "middleware"

[[example]]
name = "groups"
required-features = ["middleware-logging"]

[[example]]
name = "cookie_session"
required-features = ["middleware-session"]

[[example]]
name = "static_files"
required-features = ["static_files"]

[[example]]
name = "templates"
required-features = ["minijinja"]

[[example]]
name = "redis_session"
required-features = ["middleware-session"]

[[example]]
name = "websocket"
required-features = ["websocket"]

[dependencies]
base64 = { version = "0.23", optional = true }
bytes = "1"
constant_time_eq = { version = "0.5", optional = true }
cookie = { version = "0.18", features = ["private", "signed"], optional = true }
erased-serde = { version = "0.4", optional = true }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = { version = "1", optional = true }
hyper = "1"
hyper-tungstenite = { version = "0.30", optional = true }
hyper-util = {
  version = "0.1",
  features = ["http1", "server", "server-auto", "server-graceful"]
}
listenfd = { version = "1", optional = true }
matchit = "0.9"
mime_guess = "2"
minijinja = {
  version = "2",
  features = ["builtins", "json", "loader"],
  optional = true
}
multer = "3"
paste = "1"
pin-project-lite = { version = "0.2", optional = true }
postcard = { version = "1", features = ["use-std"], optional = true }
quick-xml = { version = "0.42", features = ["serialize"], optional = true }
rand = {
  version = "0.10",
  default-features = false,
  features = ["thread_rng"],
  optional = true
}
rust-embed = {
  version = "8",
  features = ["interpolate-folder-path"],
  optional = true
}
serde = "1"
serde_json = "1"
serde_plain = "1"
serde_urlencoded = "0.7"
smol_str = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "net", "signal"] }
tokio-util = "0.7"
tracing = { version = "0.1", default-features = false, features = ["std"] }

# for examples
[dev-dependencies]
async-stream = "0.3.6"
redis = { version = "1.0", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

[features]
default = []
full = ["middleware", "minijinja", "static_files", "websocket", "xml"]
listenfd = ["dep:listenfd"]
middleware = [
  "middleware-body_limit",
  "middleware-catch_panic",
  "middleware-cookie",
  "middleware-csrf",
  "middleware-logging",
  "middleware-session",
]
middleware-body_limit = []
middleware-catch_panic = ["dep:pin-project-lite"]
middleware-cookie = ["dep:base64", "dep:cookie", "dep:postcard"]
middleware-csrf = ["dep:constant_time_eq", "dep:rand", "middleware-cookie"]
middleware-logging = []
middleware-session = ["dep:rand", "middleware-cookie", "serde/derive"]
minijinja = ["dep:erased-serde", "dep:minijinja"]
static_files = ["dep:httpdate", "dep:rust-embed"]
static_files_debug_embed = ["rust-embed?/debug-embed"]
websocket = ["dep:hyper-tungstenite"]
xml = ["dep:quick-xml"]
